{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
      label{
        margin-left: 300px;
        width: 200px;
        display: inline-block;
      }
      #form{
        border-radius: 30px;
        background-color: pink;
        margin:180px;
      }
      body{
        background-image: url("myproject/myapp/static/assets/img/form.jpg");
        background-size: cover;
      }
    </style>
    <!-- <link rel="stylesheet" href="{% static 'assets/css/form.css'%}"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div style="min-height: 100vh;">
<form id="form" method="POST">
    
      {% csrf_token %} 
      {% for i in edit %}  
        
        
        <label style="margin-top: 20px;">STUDENT'S NAME:</label>
        <input type="text" id="fname" name="name" placeholder="first name" value="{{i.name}}"> 
   
         <br><br>
        <label>AGE:</label>
        <input type="number" name="age" id="age" value="{{i.age}}"><br><br>
  
        
        <label id="mental">DATE OF BIRTH</label>
        <input type="date" name="dob" id="dob" value="{{i.dob|date:'Y-m-d'}}"><br><br>
        
        <button type="submit">Submit</button><br><br>
    {% endfor %}
    </form>
</body>
</html>
